name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libopencv-dev
      - name: Configure
        run: cmake --preset ci-linux
      - name: Build
        run: cmake --build --preset ci-linux --parallel
      - name: Test
        run: ctest --preset ci-linux --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja qt opencv
      - name: Configure
        run: cmake --preset ci-macos
      - name: Build
        run: cmake --build --preset ci-macos --parallel
      - name: Test
        run: ctest --preset ci-macos --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true
      - name: Install OpenCV and Ninja
        shell: pwsh
        run: choco install opencv ninja --params "'/Environment'" --no-progress -y
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: pwsh
        run: |
          $opencvDir = "C:/tools/opencv/build"
          if (-not (Test-Path $opencvDir)) {
            throw "OpenCV package directory not found at $opencvDir"
          }
          cmake --preset ci-windows -DOpenCV_DIR="$opencvDir"
      - name: Build
        run: cmake --build --preset ci-windows --parallel
      - name: Test
        run: ctest --preset ci-windows --output-on-failure

  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libopencv-dev
      - name: Configure
        run: cmake --preset visual
      - name: Build
        run: cmake --build --preset visual --parallel
      - name: Test visual preset
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset visual --output-on-failure
      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: reports/visual-diffs/
          if-no-files-found: ignore

  performance-record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libopencv-dev
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Test performance preset
        run: ctest --preset performance --output-on-failure
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: reports/benchmarks/
          if-no-files-found: ignore
