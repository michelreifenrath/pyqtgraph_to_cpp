name: pgcpp-comprehensive-test
description: |
  Dark-Factory-style comprehensive regression workflow for the native C++/Qt
  PyQtGraph port. It resets this Archon worktree to origin/main, runs merge,
  visual, oracle, and autoreview checks, synthesizes an evidence-backed
  regression report, renders generated-local regression issue payloads, and
  optionally files deduplicated GitHub issues when explicitly requested. It does
  not repair code, push branches, merge, or use DynaChat/FastAPI/Bun assumptions.
provider: pi
model: openai-codex/gpt-5.5
effort: high
worktree:
  enabled: true
nodes:
  - id: reset-to-origin-main
    bash: |
      set -euo pipefail
      git fetch origin main --quiet
      git reset --hard origin/main
      git clean -ndx | tee "$ARTIFACTS_DIR/untracked-preview.txt"
      git rev-parse HEAD | tee "$ARTIFACTS_DIR/origin-main-sha.txt"
      git status --short | tee "$ARTIFACTS_DIR/reset-status.txt"
      test ! -s "$ARTIFACTS_DIR/reset-status.txt"
    timeout: 120000

  - id: merge-gate
    bash: |
      set +e
      scripts/gate merge --base origin/main --reports-dir "$ARTIFACTS_DIR/merge-gate" | tee "$ARTIFACTS_DIR/merge-gate.txt"
      code=${PIPESTATUS[0]}
      python3 - <<PY
      import json, os
      from pathlib import Path
      artifacts = Path(os.environ["ARTIFACTS_DIR"])
      (artifacts / "merge-gate-status.json").write_text(json.dumps({"command": "scripts/gate merge --base origin/main", "returncode": $code, "ok": $code == 0}, indent=2, sort_keys=True) + "\n")
      PY
      exit 0
    depends_on: [reset-to-origin-main]
    timeout: 1800000

  - id: visual-gates
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR/visual"
      scripts/gate visual SimplePlot --reports-dir "$ARTIFACTS_DIR/visual/SimplePlot" | tee "$ARTIFACTS_DIR/visual-SimplePlot.txt"
      code=${PIPESTATUS[0]}
      python3 - <<PY
      import json, os
      from pathlib import Path
      artifacts = Path(os.environ["ARTIFACTS_DIR"])
      result = {
          "targets": [{"name": "SimplePlot", "command": "scripts/gate visual SimplePlot", "returncode": $code, "ok": $code == 0, "reports_dir": str(artifacts / "visual" / "SimplePlot")}],
          "ok": $code == 0,
      }
      (artifacts / "visual-gates.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
      print(json.dumps(result, indent=2, sort_keys=True))
      PY
      exit 0
    depends_on: [merge-gate]
    timeout: 1800000

  - id: oracle-gates
    bash: |
      set +e
      python3 -m pytest -q tests/oracle tests/hierarchy | tee "$ARTIFACTS_DIR/oracle-gates.txt"
      code=${PIPESTATUS[0]}
      python3 - <<PY
      import json, os
      from pathlib import Path
      artifacts = Path(os.environ["ARTIFACTS_DIR"])
      result = {"command": "python3 -m pytest -q tests/oracle tests/hierarchy", "returncode": $code, "ok": $code == 0}
      (artifacts / "oracle-gates.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
      print(json.dumps(result, indent=2, sort_keys=True))
      PY
      exit 0
    depends_on: [visual-gates]
    timeout: 1800000

  - id: autoreview-comprehensive
    bash: |
      set +e
      scripts/run_autoreview --mode merge --base origin/main --reports-dir "$ARTIFACTS_DIR/autoreview" | tee "$ARTIFACTS_DIR/autoreview.txt"
      code=${PIPESTATUS[0]}
      python3 - <<PY
      import json, os
      from pathlib import Path
      artifacts = Path(os.environ["ARTIFACTS_DIR"])
      result = {"command": "scripts/run_autoreview --mode merge --base origin/main", "returncode": $code, "ok": $code == 0}
      (artifacts / "autoreview-status.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
      PY
      exit 0
    depends_on: [oracle-gates]
    timeout: 1800000

  - id: synthesize-regression-report
    bash: |
      set -euo pipefail
      python3 - <<'PY'
      import json, os
      from pathlib import Path
      artifacts = Path(os.environ["ARTIFACTS_DIR"])
      inputs = {
          "merge": json.loads((artifacts / "merge-gate-status.json").read_text()),
          "visual": json.loads((artifacts / "visual-gates.json").read_text()),
          "oracle": json.loads((artifacts / "oracle-gates.json").read_text()),
          "autoreview": json.loads((artifacts / "autoreview-status.json").read_text()),
      }
      failures = []
      if not inputs["merge"].get("ok"):
          failures.append({"fingerprint": "merge-gate", "command": inputs["merge"]["command"], "summary": "Comprehensive merge gate failed on origin/main", "expected": "merge gate passes", "actual": f"exit {inputs['merge']['returncode']}", "artifacts": [str(artifacts / "merge-gate.txt"), str(artifacts / "merge-gate")], "suspected_subsystem": "build-test", "validation_class": "script-infra", "issue_id": "P0.00", "owned_files": ["WORKFLOW.md"], "common_adjuncts": ["focused-tests"], "ready_for_issue_rendering": False})
      for target in inputs["visual"].get("targets", []):
          if not target.get("ok"):
              failures.append({"fingerprint": f"visual-{target['name']}", "command": target["command"], "summary": f"Visual regression gate failed for {target['name']}", "expected": "visual gate passes and artifacts match the accepted semantic review", "actual": f"exit {target['returncode']}", "artifacts": [str(artifacts / "visual-SimplePlot.txt"), target.get("reports_dir", "")], "suspected_subsystem": "visual-rendering", "validation_class": "visual-render", "issue_id": "P0.00", "owned_files": ["examples/**", "tests/visual/**", "oracle/**"], "common_adjuncts": ["focused-tests"], "ready_for_issue_rendering": False})
      if not inputs["oracle"].get("ok"):
          failures.append({"fingerprint": "oracle-gates", "command": inputs["oracle"]["command"], "summary": "Oracle regression checks failed on origin/main", "expected": "oracle and hierarchy parity checks pass", "actual": f"exit {inputs['oracle']['returncode']}", "artifacts": [str(artifacts / "oracle-gates.txt")], "suspected_subsystem": "oracle-parity", "validation_class": "core-oracle", "issue_id": "P0.00", "owned_files": ["oracle/**", "tests/oracle/**", "tests/hierarchy/**"], "common_adjuncts": ["focused-tests"], "ready_for_issue_rendering": False})
      if not inputs["autoreview"].get("ok"):
          failures.append({"fingerprint": "autoreview", "command": inputs["autoreview"]["command"], "summary": "Comprehensive autoreview reported failures", "expected": "autoreview merge mode passes", "actual": f"exit {inputs['autoreview']['returncode']}", "artifacts": [str(artifacts / "autoreview.txt"), str(artifacts / "autoreview")], "suspected_subsystem": "review-gate", "validation_class": "script-infra", "issue_id": "P0.00", "owned_files": ["scripts/**", "automation/**"], "common_adjuncts": ["focused-tests"], "ready_for_issue_rendering": False})
      report = {"tested_sha": (artifacts / "origin-main-sha.txt").read_text().strip(), "ok": not failures, "failures": failures, "inputs": inputs}
      (artifacts / "comprehensive-report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
      md = ["# pgcpp comprehensive regression report", "", f"Tested SHA: `{report['tested_sha']}`", "", f"Status: {'pass' if report['ok'] else 'fail'}", ""]
      for failure in failures:
          md.extend([f"## {failure['summary']}", "", f"- Command: `{failure['command']}`", f"- Expected: {failure['expected']}", f"- Actual: {failure['actual']}", f"- Artifacts: {', '.join(failure['artifacts'])}", ""])
      (artifacts / "comprehensive-report.md").write_text("\n".join(md), encoding="utf-8")
      print(json.dumps(report, indent=2, sort_keys=True))
      PY
    depends_on: [autoreview-comprehensive]
    timeout: 60000

  - id: dedupe-regression-candidates
    bash: |
      set -euo pipefail
      python3 - <<'PY'
      import json, os, subprocess
      from pathlib import Path
      artifacts = Path(os.environ["ARTIFACTS_DIR"])
      report = json.loads((artifacts / "comprehensive-report.json").read_text())
      existing_text = subprocess.run(["gh", "issue", "list", "--state", "open", "--label", "factory:from-regression", "--json", "number,title,body"], check=False, text=True, capture_output=True).stdout or "[]"
      try:
          existing = json.loads(existing_text)
      except json.JSONDecodeError:
          existing = []
      decisions = []
      for failure in report.get("failures", []):
          fp = failure["fingerprint"]
          duplicate = next((item for item in existing if fp in ((item.get("body") or "") + "\n" + (item.get("title") or ""))), None)
          decisions.append({"fingerprint": fp, "decision": "skip" if duplicate else "render", "duplicate_issue": duplicate.get("number") if duplicate else None, "failure": failure})
      result = {"existing_count": len(existing), "decisions": decisions}
      (artifacts / "regression-dedupe.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
      print(json.dumps(result, indent=2, sort_keys=True))
      PY
    depends_on: [synthesize-regression-report]
    timeout: 120000

  - id: render-regression-issues
    bash: |
      set -euo pipefail
      mkdir -p "$ARTIFACTS_DIR/regression-issues" "$ARTIFACTS_DIR/regression-metadata"
      # Legacy quoting contract: python3 scripts/factory/file_regression_issue.py --input "$ARGUMENTS"
      MANUAL_INPUT=""
      for arg in $ARGUMENTS; do
        case "$arg" in
          --file-github-issues) ;;
          *) if [ -z "$MANUAL_INPUT" ]; then MANUAL_INPUT="$arg"; fi ;;
        esac
      done
      if [ -n "$MANUAL_INPUT" ]; then
        python3 scripts/factory/file_regression_issue.py --input "$MANUAL_INPUT" | tee "$ARTIFACTS_DIR/regression-issue.json"
      fi
      python3 - <<'PY'
      import json, os, subprocess
      from pathlib import Path
      artifacts = Path(os.environ["ARTIFACTS_DIR"])
      dedupe = json.loads((artifacts / "regression-dedupe.json").read_text())
      rendered = []
      for index, decision in enumerate(dedupe.get("decisions", []), start=1):
          if decision.get("decision") != "render":
              continue
          failure = decision["failure"]
          metadata = {
              "command": failure["command"],
              "summary": failure["summary"],
              "expected": failure["expected"],
              "actual": failure["actual"],
              "artifacts": failure["artifacts"],
              "suspected_subsystem": failure["suspected_subsystem"],
              "issue_id": failure.get("issue_id", ""),
              "validation_class": failure.get("validation_class", "script-infra"),
              "owned_files": failure.get("owned_files", []),
              "common_adjuncts": failure.get("common_adjuncts", ["focused-tests"]),
              "risk": "medium",
          }
          metadata_path = artifacts / "regression-metadata" / f"{index:02d}-{failure['fingerprint']}.json"
          output_path = artifacts / "regression-issues" / f"{index:02d}-{failure['fingerprint']}.json"
          metadata_path.write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n")
          completed = subprocess.run(["python3", "scripts/factory/file_regression_issue.py", "--input", str(metadata_path)], check=False, text=True, capture_output=True)
          output_path.write_text(completed.stdout, encoding="utf-8")
          rendered.append({"fingerprint": failure["fingerprint"], "metadata": str(metadata_path), "payload": str(output_path), "returncode": completed.returncode})
      result = {"rendered": rendered}
      (artifacts / "rendered-regression-issues.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
      print(json.dumps(result, indent=2, sort_keys=True))
      PY
    depends_on: [dedupe-regression-candidates]
    timeout: 120000

  - id: optionally-file-deduped-regression-issues
    bash: |
      set -euo pipefail
      SHOULD_FILE=false
      case " $ARGUMENTS " in
        *" --file-github-issues "*) SHOULD_FILE=true ;;
      esac
      SHOULD_FILE="$SHOULD_FILE" python3 - <<'PY'
      import json, os, subprocess
      from pathlib import Path
      artifacts = Path(os.environ["ARTIFACTS_DIR"])
      rendered = json.loads((artifacts / "rendered-regression-issues.json").read_text()).get("rendered", [])
      should_file = os.environ.get("SHOULD_FILE") == "true"
      filed = []
      for item in rendered:
          payload = json.loads(Path(item["payload"]).read_text())
          if not should_file:
              filed.append({"fingerprint": item["fingerprint"], "action": "skipped", "reason": "GitHub filing disabled; pass --file-github-issues to enable"})
              continue
          if not payload.get("ready"):
              filed.append({"fingerprint": item["fingerprint"], "action": "skipped", "reason": "rendered issue payload is not ai:ready"})
              continue
          body_path = artifacts / "regression-issues" / f"{item['fingerprint']}.md"
          body_path.write_text(payload["body"], encoding="utf-8")
          labels = []
          for label in payload.get("labels", []):
              labels.extend(["--label", label])
          completed = subprocess.run(["gh", "issue", "create", "--title", payload["title"], "--body-file", str(body_path), *labels], check=False, text=True, capture_output=True)
          filed.append({"fingerprint": item["fingerprint"], "action": "filed" if completed.returncode == 0 else "failed", "returncode": completed.returncode, "stdout": completed.stdout, "stderr": completed.stderr})
      result = {"enabled": should_file, "results": filed}
      (artifacts / "regression-filing.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
      print(json.dumps(result, indent=2, sort_keys=True))
      PY
    depends_on: [render-regression-issues]
    timeout: 120000

  - id: workflow-integrity-audit
    bash: |
      set -euo pipefail
      cat > "$ARTIFACTS_DIR/.workflow_integrity_audit.py" <<'PY_AUDIT'
      import json, os, sys
      from pathlib import Path

      artifacts = Path(os.environ["ARTIFACTS_DIR"])
      workflow_id = os.environ.get("WORKFLOW_ID") or artifacts.name
      required = [x for x in os.environ.get("AUDIT_REQUIRED", "").split(",") if x]
      status_jsons = [x for x in os.environ.get("AUDIT_STATUS_JSONS", "").split(",") if x]
      checks = []

      def add(name, ok, details=""):
          checks.append({"name": name, "ok": bool(ok), "details": str(details)[:1000]})

      def load_json(name):
          path = artifacts / name
          try:
              return json.loads(path.read_text())
          except Exception as exc:
              add(f"json:{name}", False, f"invalid json: {exc}")
              return None

      for name in required:
          path = artifacts / name
          add(f"artifact:{name}", path.exists(), "present" if path.exists() else "missing")

      for name in status_jsons:
          path = artifacts / name
          add(f"artifact:{name}", path.exists(), "present" if path.exists() else "missing")
          if not path.exists():
              continue
          data = load_json(name)
          if isinstance(data, dict):
              if "ok" in data:
                  add(f"status:{name}:ok", data.get("ok") is True, json.dumps(data, sort_keys=True)[:500])
              if "visual_ok" in data:
                  add(f"status:{name}:visual_ok", data.get("visual_ok") is True, json.dumps(data, sort_keys=True)[:500])

      log_candidates = []
      if workflow_id:
          roots = [Path("/.archon/workspaces"), Path.cwd() / ".archon" / "logs"]
          for root in roots:
              if root.exists():
                  log_candidates.extend(root.rglob(f"{workflow_id}.jsonl"))
      if log_candidates:
          log_path = sorted(log_candidates, key=lambda p: p.stat().st_mtime, reverse=True)[0]
          events = []
          for line in log_path.read_text(errors="replace").splitlines():
              try:
                  events.append(json.loads(line))
              except Exception:
                  pass
          error_events = [e for e in events if e.get("type") in {"node_error", "workflow_error"}]
          add("workflow-log:error-events", not error_events, f"{len(error_events)} error events in {log_path}")
          started = {e.get("node_id") or e.get("nodeId") for e in events if e.get("type") == "node_start"}
          completed = {e.get("node_id") or e.get("nodeId") for e in events if e.get("type") == "node_complete"}
          missing = sorted(x for x in started - completed if x and x != "workflow-integrity-audit")
          add("workflow-log:started-nodes-completed", not missing, ", ".join(missing) or "all started prior nodes completed")
      else:
          add("workflow-log:found", False, f"no log found for WORKFLOW_ID={workflow_id!r}")

      ok = all(c["ok"] for c in checks)
      payload = {"ok": ok, "workflow_id": workflow_id, "required": required, "status_jsons": status_jsons, "checks": checks}
      (artifacts / "workflow-integrity-audit.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
      lines = ["# Workflow integrity audit", "", f"Overall: {'PASS' if ok else 'FAIL'}", ""]
      for c in checks:
          lines.append(f"- [{'x' if c['ok'] else ' '}] {c['name']}: {c['details']}")
      (artifacts / "workflow-integrity-audit.md").write_text("\n".join(lines) + "\n")
      print(json.dumps(payload, indent=2, sort_keys=True))
      if not ok:
          sys.exit(1)
      PY_AUDIT
      python3 "$ARTIFACTS_DIR/.workflow_integrity_audit.py"
    depends_on: [optionally-file-deduped-regression-issues]
    env:
      AUDIT_REQUIRED: "merge-gate-status.json,visual-gates.json,oracle-gates.json,autoreview-status.json,comprehensive-report.json,regression-dedupe.json,rendered-regression-issues.json,regression-filing.json"
      AUDIT_STATUS_JSONS: "merge-gate-status.json,visual-gates.json,oracle-gates.json,autoreview-status.json,comprehensive-report.json"
    timeout: 120000

  - id: comprehensive-guidance
    command: pgcpp-comprehensive-test
    depends_on: [workflow-integrity-audit]
    context: fresh
    idle_timeout: 300000
